resources:
  jobs:
    Tesouro_ingestion:
      name: Tesouro_ingestion

      tasks:
        - task_key: setup_unity_catalog
          notebook_task:
            notebook_path: ../setup/00_setup_unity_catalog.py
            source: WORKSPACE
          environment_key: Default

        - task_key: download_operations
          depends_on:
            - task_key: setup_unity_catalog
          spark_python_task:
            python_file: ../ingestions/download_csv.py
            parameters:
              - --config
              - ../config/sources.yml
              - --source
              - tesouro_direto_operacoes_2025
          environment_key: Default

        - task_key: download_investidores
          depends_on:
            - task_key: setup_unity_catalog
          spark_python_task:
            python_file: ../ingestions/download_csv.py
            parameters:
              - --config
              - ../config/sources.yml
              - --source
              - tesouro_direto_investidores_2025
          environment_key: Default

        - task_key: operations_raw_to_bronze_table
          depends_on:
            - task_key: download_operations
          notebook_task:
            notebook_path: ../notebooks/bronze/01_bronze_from_raw_csv.py
            base_parameters:
              config: ../../config/sources.yml
              source: tesouro_direto_operacoes_2025
            source: WORKSPACE
          environment_key: Default

        - task_key: investidores_raw_to_bronze
          depends_on:
            - task_key: download_investidores
          notebook_task:
            notebook_path: ../notebooks/bronze/01_bronze_from_raw_csv.py
            base_parameters:
              config: ../../config/sources.yml
              source: tesouro_direto_investidores_2025
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_bronze_operacoes
          depends_on:
            - task_key: operations_raw_to_bronze_table
          notebook_task:
            notebook_path: ../notebooks/quality/01_quality_bronze.py
            base_parameters:
              config: ../../config/sources.yml
              source: tesouro_direto_operacoes_2025
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_bronze_operacoes
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_operacoes
          depends_on:
            - task_key: quality_bronze_operacoes
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_bronze_operacoes
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_bronze_investidores
          depends_on:
            - task_key: investidores_raw_to_bronze
          notebook_task:
            notebook_path: ../notebooks/quality/01_quality_bronze.py
            base_parameters:
              config: ../../config/sources.yml
              source: tesouro_direto_investidores_2025
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_bronze_investidores
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_investidores
          depends_on:
            - task_key: quality_bronze_investidores
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_bronze_investidores
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: hub_titulo
          depends_on:
            - task_key: quality_bronze_operacoes
          notebook_task:
            notebook_path: ../notebooks/silver/datavault/01_hub.py
            base_parameters:
              config: ../../../config/datavault.yml
              hub_name: hubTitulo
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_silver_hub_titulo
          depends_on:
            - task_key: hub_titulo
          notebook_task:
            notebook_path: ../notebooks/quality/02_quality_silver_hub.py
            base_parameters:
              config: ../../config/datavault.yml
              hub_name: hubTitulo
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_hub_titulo
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_hub_titulo
          depends_on:
            - task_key: quality_silver_hub_titulo
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_hub_titulo
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: hub_investidor
          depends_on:
            - task_key: quality_bronze_investidores
          notebook_task:
            notebook_path: ../notebooks/silver/datavault/01_hub.py
            base_parameters:
              config: ../../../config/datavault.yml
              hub_name: hubInvestidor
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_silver_hub_investidor
          depends_on:
            - task_key: hub_investidor
          notebook_task:
            notebook_path: ../notebooks/quality/02_quality_silver_hub.py
            base_parameters:
              config: ../../config/datavault.yml
              hub_name: hubInvestidor
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_hub_investidor
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_hub_investidor
          depends_on:
            - task_key: quality_silver_hub_investidor
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_hub_investidor
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: link_investidor_titulo_operacao
          depends_on:
            - task_key: quality_silver_hub_titulo
            - task_key: quality_silver_hub_investidor
          notebook_task:
            notebook_path: ../notebooks/silver/datavault/02_link.py
            base_parameters:
              config: ../../../config/datavault.yml
              link_name: linkInvestidorTituloOperacao
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_silver_link_operacao
          depends_on:
            - task_key: link_investidor_titulo_operacao
          notebook_task:
            notebook_path: ../notebooks/quality/03_quality_silver_link.py
            base_parameters:
              config: ../../config/datavault.yml
              link_name: linkInvestidorTituloOperacao
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_link_operacao
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_link_operacao
          depends_on:
            - task_key: quality_silver_link_operacao
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_link_operacao
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: sat_operacao
          depends_on:
            - task_key: quality_silver_link_operacao
          notebook_task:
            notebook_path: ../notebooks/silver/datavault/03_satellite.py
            base_parameters:
              config: ../../../config/datavault.yml
              satellite_name: satOperacao
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_silver_sat_operacao
          depends_on:
            - task_key: sat_operacao
          notebook_task:
            notebook_path: ../notebooks/quality/04_quality_silver_satellite.py
            base_parameters:
              config: ../../config/datavault.yml
              satellite_name: satOperacao
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_sat_operacao
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_sat_operacao
          depends_on:
            - task_key: quality_silver_sat_operacao
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_sat_operacao
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: sat_investidor
          depends_on:
            - task_key: quality_silver_hub_investidor
          notebook_task:
            notebook_path: ../notebooks/silver/datavault/03_satellite.py
            base_parameters:
              config: ../../../config/datavault.yml
              satellite_name: satInvestidor
            source: WORKSPACE
          environment_key: Default

        - task_key: quality_silver_sat_investidor
          depends_on:
            - task_key: sat_investidor
          notebook_task:
            notebook_path: ../notebooks/quality/04_quality_silver_satellite.py
            base_parameters:
              config: ../../config/datavault.yml
              satellite_name: satInvestidor
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_sat_investidor
              severity_on_failure: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: send_slack_alert_sat_investidor
          depends_on:
            - task_key: quality_silver_sat_investidor
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/notifications/01_send_slack_data_quality_alert.py
            base_parameters:
              alerts_config: ../../config/alerts.yml
              catalog: lakehouse_lab
              pipeline_name: tesouro_direto_pipeline
              task_name: quality_silver_sat_investidor
              severity: ERROR
            source: WORKSPACE
          environment_key: Default

        - task_key: dbt_gold
          depends_on:
            - task_key: quality_silver_link_operacao
            - task_key: quality_silver_sat_operacao
            - task_key: quality_silver_sat_investidor

          dbt_task:
            project_directory: ../dbt

            commands:
              - "dbt deps"
              - "dbt build --fail-fast"

            source: WORKSPACE

          environment_key: Default

      queue:
        enabled: true

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"

      performance_target: PERFORMANCE_OPTIMIZED